<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Pago - Pixel & Slice</title>
  <link rel="stylesheet" href="confirmacion.css">
</head>
<body>
<header class="navbar">
  <a href="../catalogo/catalogo.html" class="logo">
    <img src="../login/login.jpg" alt="PS" style="height:70px;">
  </a>
  <nav><ul></ul></nav>
</header>

<main class="confirmacion-main">
  <div class="confirmacion-card">
    <div class="confirmacion-header">
      <h2>5. CONFIRMACIÓN ✓</h2>
    </div>

    <div class="confirmacion-body">
      <div class="icono-check">✔</div>
      <h1>¡Compra Exitosa!</h1>
      <p class="orden">Número de orden: <a id="ordLink" href="#">—</a></p>

      <div id="listaItems" class="items"></div>

      <div class="detalle-pago">
        <p><strong>Total pagado:</strong> <span id="totalPagado">$0</span></p>
        <p><strong>Fecha:</strong> <span id="fecha"></span></p>
      </div>
    </div>

    <div class="confirmacion-footer">
      <a class="btn-primary" href="../catalogo/catalogo.html">Volver al catálogo</a>
    </div>
  </div>
</main>
