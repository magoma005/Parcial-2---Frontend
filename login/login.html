<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inicia Sesión - Pixel & Slice</title>
  <link rel="stylesheet" href="login.css"/>
</head>
<body>
<header class="navbar">
  <a href="../catalogo/catalogo.html" class="logo">
    <img src="login.jpg" alt="PS" style="height:70px;">
  </a>
  <nav><ul></ul></nav>
</header>

<section class="login-section">
  <div class="login-container">
    <h2>Iniciar Sesión</h2>
    <form id="loginForm" autocomplete="on">
      <input id="email" type="email" placeholder="Correo electrónico" required />
      <input id="password" type="password" placeholder="Contraseña" required />
      <button id="btnLogin" type="submit">Iniciar Sesión</button>
      <button type="button" onclick="window.location.href='registro.html'" class="secundario">Regístrate</button>
    </form>
  </div>
</section>

<footer>
  <p>&copy; 2025 Pixel & Slice. Todos los derechos reservados.</p>
</footer>

<script type="module">
  import { login, consumeAfterLoginRedirect } from "../auth/auth.js";

  const form = document.getElementById("loginForm");
  const btn  = document.getElementById("btnLogin");

  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    btn.disabled = true; btn.textContent = "Ingresando…";
    try{
      await login({ email, password });
      const destino = consumeAfterLoginRedirect();
      window.location.href = destino;
    }catch(err){
      alert("No se pudo iniciar sesión: " + (err.message || "Error"));
    }finally{
      btn.disabled = false; btn.textContent = "Iniciar Sesión";
    }
  });
</script>
</body>
</html>
