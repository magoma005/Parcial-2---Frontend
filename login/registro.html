<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro - Pixel & Slice</title>
  <link rel="stylesheet" href="login.css"/>
</head>
<body>
<header class="navbar">
  <a href="../catalogo/catalogo.html" class="logo">
    <img src="login.jpg" alt="PS" style="height:70px;">
  </a>
  <nav><ul></ul></nav>
</header>

<section class="login-section">
  <div class="login-container">
    <h2>Crear cuenta</h2>
    <form id="registerForm">
      <input id="nombre" type="text" placeholder="Nombre" required />
      <input id="email" type="email" placeholder="Correo electrónico" required />
      <input id="password" type="password" placeholder="Contraseña (mín. 4)" minlength="4" required />
      <button id="btnReg" type="submit">Registrarme</button>
      <button type="button" onclick="window.location.href='login.html'" class="secundario">Ya tengo cuenta</button>
    </form>
  </div>
</section>

<footer>
  <p>&copy; 2025 Pixel & Slice. Todos los derechos reservados.</p>
</footer>

<script type="module">
  import { register, consumeAfterLoginRedirect } from "../auth/auth.js";

  const form = document.getElementById("registerForm");
  const btn  = document.getElementById("btnReg");

  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const nombre   = document.getElementById("nombre").value.trim();
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    btn.disabled = true; btn.textContent = "Creando…";
    try{
      await register({ nombre, email, password });
      const destino = consumeAfterLoginRedirect();
      window.location.href = destino;
    }catch(err){
      alert("No se pudo registrar: " + (err.message || "Error"));
    }finally{
      btn.disabled = false; btn.textContent = "Registrarme";
    }
  });
</script>
</body>
</html>
